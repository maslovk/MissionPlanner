name: DotNet Build
on: [push, workflow_dispatch, pull_request]

jobs:
  build:
    name: Build Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 10

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          nuget locals all -clear
          msbuild -v:m -restore -t:Build -p:Configuration=Release MissionPlanner.sln

      # The C++ MAVLink core for the mpcore_shadow/receive/send settings, one DLL per process
      # bitness (Mission Planner is AnyCPU), placed where MpCoreNativeLoader loads it from: next to
      # the application, and next to the tests that exercise it.
      - name: Build mpcore
        shell: pwsh
        run: |
          . .github/scripts/run-annotated.ps1
          foreach ($arch in @('x64', 'x86')) {
            Invoke-Annotated { cmake --preset windows-$arch -S ExtLibs/mpcore -DMPCORE_BUILD_TESTS=OFF } | Out-Null
            Invoke-Annotated { cmake --build ExtLibs/mpcore/build/windows-$arch --config Release --target mpcore } | Out-Null
            foreach ($dir in @('bin/Release/net461', 'MissionPlannerTests/bin/Release/net472')) {
              New-Item -ItemType Directory -Force $dir/$arch | Out-Null
              Copy-Item ExtLibs/mpcore/build/windows-$arch/bin/Release/mpcore.dll $dir/$arch/
            }
          }

      - name: MAVLink protocol regression tests
        shell: pwsh
        env:
          MPCORE_REQUIRED: '1' # the MpCore*Tests fail rather than skip without the native library
        run: |
          . .github/scripts/run-annotated.ps1
          $out = Invoke-Annotated { dotnet test MissionPlannerTests/MissionPlannerTests.csproj --configuration Release --filter "FullyQualifiedName~Sysid32Tests|FullyQualifiedName~MpCoreReceiveTests|FullyQualifiedName~MpCoreSendTests|FullyQualifiedName~MpCoreParamsTests|FullyQualifiedName~MpCoreMissionTests" --logger "trx;LogFileName=sysid32.trx" --logger "console;verbosity=normal" }
          # which tests ran, readable without a login
          $summary = ($out | Select-String -Pattern '^\s*(Passed|Failed|Skipped) [A-Za-z]|Total tests|Passed!|Failed!' | ForEach-Object { $_.Line.Trim() }) -join "`n"
          Write-Host "::notice title=MAVLink tests::$(ConvertTo-AnnotationText $summary)"

      - name: Cleanup
        shell: pwsh
        run: |
          cd bin\Release\net461
          gci plugins | ForEach-Object {                 if (Test-Path $_.Name -PathType Leaf)                {                    Write-Host "Remove" $_.FullName   ;                 Remove-Item $_.FullName                            } else {                    Write-Host $_.Name                }            }

          copy version.txt ..\..\..\
          7z a -tzip ..\..\..\MissionPlannerBeta.zip *
          cd ..
          .\md5sum.exe net461 > ..\..\checksums.txt
          
      - uses: actions/upload-artifact@v4
        with:
          name: MissionPlannerBeta
          path: bin\Release\net461
          
      - uses: "marvinpinto/action-automatic-releases@v1.2.1"
        if: ${{ github.ref == 'refs/tags/beta' }}
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "betarelease"
          prerelease: true
          title: "Beta Build"
          files: |
            MissionPlannerBeta.zip
            checksums.txt
            version.txt
            ChangeLog.txt


  buildDebug:
    name: Build Debug
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 10

      - name: Cache multiple paths
        uses: actions/cache@v4
        with:
          path: |
            **/obj/**
          key: ${{ runner.os }}-buildDebug

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          nuget locals all -clear
          msbuild -v:m -restore -t:Build -p:Configuration=Debug MissionPlanner.sln

      - name: Cleanup
        shell: pwsh
        run: |
          cd bin\Debug\net461
          gci plugins | ForEach-Object {                 if (Test-Path $_.Name -PathType Leaf)                {                    Write-Host "Remove" $_.FullName   ;                 Remove-Item $_.FullName                            } else {                    Write-Host $_.Name                }            }
