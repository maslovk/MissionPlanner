name: mpcore

on:
  push:
    paths:
      - 'ExtLibs/mpcore/**'
      # the MAVLink definitions, and the C# parser and shadow comparer the parity test runs
      - 'ExtLibs/Mavlink/**'
      - 'ExtLibs/ArduPilot/Mavlink/MpCoreShadow.cs'
      - '.github/workflows/mpcore.yml'
      - '.github/scripts/run-annotated.ps1'
  pull_request:
    paths:
      - 'ExtLibs/mpcore/**'
      # the MAVLink definitions, and the C# parser and shadow comparer the parity test runs
      - 'ExtLibs/Mavlink/**'
      - 'ExtLibs/ArduPilot/Mavlink/MpCoreShadow.cs'
      - '.github/workflows/mpcore.yml'
      - '.github/scripts/run-annotated.ps1'
  workflow_dispatch:

jobs:
  linux:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-release, linux-asan]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # only the generator; the Mono submodule is large and not needed
      - name: Check out pymavlink
        run: git submodule update --init --depth 1 ExtLibs/mpcore/third_party/pymavlink
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build mono-mcs mono-runtime libmono-system-runtime-serialization4.0-cil
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -S ExtLibs/mpcore -DMPCORE_CSHARP_COMPILER=$(command -v mcs)
      - name: Build
        run: cmake --build ExtLibs/mpcore/build/${{ matrix.preset }}
      - name: Test
        run: ctest --test-dir ExtLibs/mpcore/build/${{ matrix.preset }} --output-on-failure

  windows:
    name: Windows ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-x64, windows-x86]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check out pymavlink
        run: git submodule update --init --depth 1 ExtLibs/mpcore/third_party/pymavlink
      # the run-annotated wrapper repeats a failure's output as an annotation, readable without a login
      - name: Configure
        shell: pwsh
        run: |
          cmake --version
          $csc = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "MSBuild\Current\Bin\Roslyn\csc.exe" | Select-Object -First 1
          . .github/scripts/run-annotated.ps1
          Invoke-Annotated { cmake --preset ${{ matrix.preset }} -S ExtLibs/mpcore "-DMPCORE_CSHARP_COMPILER=$csc" }
      - name: Build
        shell: pwsh
        run: |
          . .github/scripts/run-annotated.ps1
          Invoke-Annotated { cmake --build ExtLibs/mpcore/build/${{ matrix.preset }} --config Release }
      - name: Test
        shell: pwsh
        run: |
          . .github/scripts/run-annotated.ps1
          Invoke-Annotated { ctest --test-dir ExtLibs/mpcore/build/${{ matrix.preset }} -C Release --output-on-failure }
      - uses: actions/upload-artifact@v4
        with:
          name: mpcore-${{ matrix.preset }}
          path: ExtLibs/mpcore/build/${{ matrix.preset }}/bin/Release/mpcore.dll
